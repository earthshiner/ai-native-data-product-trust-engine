name: CI

# Foundation CI for the Trust Engine. The test job is the merge gate: it runs the
# full pytest suite, which includes tests/test_contract.py — the guard that the
# golden fixture (contract/trust_payload_example.json) still matches what the real
# serialiser emits. When that fixture changes it must be re-vendored into the
# Data Product Browser. The test-teradata job additionally installs the optional
# teradata extra so the sqlalchemy-backed adapter tests run instead of skipping.
# Lint (ruff) is a required check.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies (locked, with dev extra)
        run: uv sync --frozen --extra dev

      - name: Run test suite
        run: uv run --frozen --extra dev pytest -q
        env:
          PYTHONUTF8: "1"

  # Runs the suite with the optional teradata extra present, so the
  # sqlalchemy-backed SqlAlchemyAdapter tests execute (they importorskip on the
  # dev-only job above). Covers the connection-pool / dispose behaviour.
  test-teradata:
    name: test (teradata extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies (locked, with dev + teradata extras)
        run: uv sync --frozen --extra dev --extra teradata

      - name: Run test suite
        run: uv run --frozen --extra dev --extra teradata pytest -q
        env:
          PYTHONUTF8: "1"

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies (locked, with dev extra)
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run --frozen --extra dev ruff check .
