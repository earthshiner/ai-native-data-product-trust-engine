name: CI

# Foundation CI for the Trust Engine. The test job is the merge gate: it runs the
# full pytest suite, which includes tests/test_contract.py — the guard that the
# golden fixture (contract/trust_payload_example.json) still matches what the real
# serialiser emits. When that fixture changes it must be re-vendored into the
# Data Product Browser. Lint runs separately and is non-blocking until the
# existing ruff debt is cleared.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies (locked, with dev extra)
        run: uv sync --frozen --extra dev

      - name: Run test suite
        run: uv run --frozen --extra dev pytest -q
        env:
          PYTHONUTF8: "1"

  lint:
    name: lint (ruff, non-blocking)
    runs-on: ubuntu-latest
    # Informational only: the repo has pre-existing ruff findings. Flip this to a
    # required check once `uv run ruff check .` is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies (locked, with dev extra)
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run --frozen --extra dev ruff check .
