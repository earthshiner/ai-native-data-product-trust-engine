[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-native-data-product-trust-engine"
version = "0.1.0"
description = "Validation and self-healing engine for AI-native Data Products on Teradata."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Paul Dancer", email = "paul.dancer@teradata.com" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]
teradata = [
  "teradatasql>=20.0",
  "teradatasqlalchemy>=20.0",
  "SQLAlchemy>=2.0"
]
mcp = [
  "mcp>=1.0"
]

[project.scripts]
adp-trust-engine = "ai_native_data_product_trust_engine.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 (line-too-long) is not enforced: the bulk of long lines are intentional
# single-line SQL / HTML / message string literals (generated SQL in
# test_generation.py, query_templates.py, html_reports.py, …) where mechanical
# wrapping hurts readability. The high-value rules — F (undefined/unused),
# I (imports), UP (upgrades), B (bugbear), and the rest of E — stay enforced.
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_native_data_product_trust_engine"]

[tool.hatch.build.targets.wheel.force-include]
"src/ai_native_data_product_trust_engine/assets/orange_blue_gradient.jpg" = "ai_native_data_product_trust_engine/assets/orange_blue_gradient.jpg"

[tool.hatch.build.targets.sdist.force-include]
"src/ai_native_data_product_trust_engine/assets/orange_blue_gradient.jpg" = "src/ai_native_data_product_trust_engine/assets/orange_blue_gradient.jpg"
